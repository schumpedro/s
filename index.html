<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pokémons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Pokémons</h1>

        <form id="form-pokemon">
            <div class="campo">
                <label for="nome">Nome do Pokémon:</label>
                <input type="text" id="nome" placeholder="Ex: pikachu" autocomplete="off" required>
            </div>

            <div class="campo">
                <label for="treinador">Nome do Treinador (opcional):</label>
                <input type="text" id="treinador" placeholder="Seu nome">
            </div>

            <div class="campo">
                <label for="tipo">Tipo (automático):</label>
                <input type="text" id="tipo" readonly>
            </div>

            <div class="campo">
                <label for="cp">Combat Power (automático):</label>
                <input type="number" id="cp" readonly>
            </div>

            <button type="submit">Cadastrar na Arena</button>
            <p id="feedback" aria-live="polite"></p>
        </form>

        <div id="lista-cards" class="arena-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
