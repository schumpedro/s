<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pokémons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐉 <span class="titulo">Cadastre seu Pokemon hilário!</span></h1>

        <form id="form-pokemon">
            <div class="campo campo-busca">
                <label for="nome">Nome do Pokémon:</label>
                <input type="text" id="nome" placeholder="Ex: pikachu" autocomplete="off" required>
                <ul id="sugestoes" class="sugestoes" hidden></ul>
            </div>

            <div class="campo campo-busca">
                <label for="treinador">Nome do Treinador:</label>
                <input type="text" id="treinador" placeholder="Ex: pedro hilário" autocomplete="off" required>
                <ul id="sugestoes-treinador" class="sugestoes" hidden></ul>
            </div>

            <div class="campo">
                <label for="tipo">Tipo (automático):</label>
                <input type="text" id="tipo" readonly>
            </div>

            <div class="campo">
                <label for="CP">Combat Power (automático):</label>
                <input type="number" id="CP" readonly>
            </div>

            <button type="submit">✅ Cadastrar na Arena</button>
            <button type="button" id="botaolimpar">🧹 Limpar</button>
            <button type="button" id="botaobatalha">⚔️ Batalhar</button>
            <button type="button" id="botaolimpararena">🗑️ Limpar arena</button>
            <p id="feedback" aria-live="polite"></p>
        </form>

        <h2 id="contador">Arena (0)</h2>
        <div id="lista-cards" class="arena-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
